name: Android APK

# Builds the debug APK on a GitHub-hosted Linux runner, so no Android SDK,
# NDK or JDK has to be installed locally. Download the artifact from the run
# summary page and sideload it with `adb install -r app-debug.apk`.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'desktop/**'
      - 'shared/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install SDK packages
        # Pinned to what android/app/build.gradle expects: platform 35,
        # build-tools 35, NDK 27.0.12077973 (AGP 8.7.3 default) and CMake 3.22.1.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Fetch SDL2 2.30.9
        run: bash scripts/fetch-sdl2.sh

      - name: Set up Zig 0.13.0
        run: |
          curl -fsSL --retry 3 \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Bundle Windows server in APK
        run: bash scripts/package-android-server.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK server asset
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk \
            assets/remote_mouse_server.exe > "$RUNNER_TEMP/packaged-server.exe"
          cmp android/app/src/main/assets/remote_mouse_server.exe \
            "$RUNNER_TEMP/packaged-server.exe"

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/
          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remote-mouse-debug-apk
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 30
